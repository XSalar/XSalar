---
- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: reload dnsdist
  ansible.builtin.systemd:
    name: dnsdist
    state: reloaded
  # dnsdist re-reads the domain files on reload; falls back to restart
  # if reload is unsupported for the change.
  failed_when: false
