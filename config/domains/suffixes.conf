# Smart DNS — SUFFIX (anchored) target domains
# ------------------------------------------------------------------
# One domain per line. A suffix entry matches the name itself AND all
# subdomains:  "youtube.com" matches youtube.com, www.youtube.com,
# rr1---sn-abc.googlevideo.com, etc.
#
# Comments (#) and blank lines are ignored. Whitespace is stripped.
# Keep this list CONSERVATIVE. Only add a domain after a captured,
# metadata-only test proves the TV actually needs it (see RUNBOOK.md).
#
# Edit with:  scripts/domains.sh add-suffix <domain>
# Never edit the running config by hand — always reload via the script.
# ------------------------------------------------------------------
youtube.com
youtu.be
youtube-nocookie.com
googlevideo.com
ytimg.com
