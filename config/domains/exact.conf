# Smart DNS — EXACT target domains
# ------------------------------------------------------------------
# One fully-qualified name per line. An exact entry matches ONLY that
# name (and, for DNS matching robustness, names strictly under it are
# NOT implied — use suffixes.conf if you need subdomain coverage).
#
# These are the auth / API / avatar endpoints the YouTube app needs.
# We deliberately do NOT proxy all of google.com / googleapis.com /
# gstatic.com / googleusercontent.com. Add broader Google domains only
# with captured evidence (see RUNBOOK.md "Widening the allowlist").
#
# Edit with:  scripts/domains.sh add-exact <domain>
# ------------------------------------------------------------------
youtubei.googleapis.com
youtube.googleapis.com
yt3.ggpht.com
accounts.google.com
oauth2.googleapis.com
www.googleapis.com
